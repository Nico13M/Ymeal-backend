nelmio_cors:
    defaults:
        allow_origin: ['https://ymeal-back.osc-fr1.scalingo.io', 'http://localhost:*']
        allow_credentials: true
        allow_methods: ['GET', 'POST', 'PATCH', 'PUT', 'DELETE', 'OPTIONS']
        allow_headers: ['Content-Type', 'X-CSRF-TOKEN', 'Authorization']
        max_age: 3600
    paths:
        '^/':
            origin_regex: true
            allow_origin: ['^https?://([a-z0-9-]+\.)*scalingo\.io(:[0-9]+)?$', '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$']
            allow_headers: ['*']
            allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
            max_age: 3600
