components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Jeton renvoyé par /admin/auth/login ou /admin/auth/register.
  parameters:
    Csrf:
      name: X-CSRF-TOKEN
      in: header
      description: Jeton obtenu via GET /admin/security/csrf-token.
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: integer }
    RecipeId:
      name: recipeId
      in: path
      required: true
      schema: { type: integer }
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema: { type: integer }
  responses:
    BadRequest:
      description: Donnée invalide
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Jeton absent, invalide ou expiré
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Accès interdit
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Introuvable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Trop de tentatives (limitation). Attendre le nombre de secondes de l'en-tête Retry-After.
      headers:
        Retry-After:
          description: Secondes avant la prochaine tentative
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Doublon ou élément encore utilisé
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    AuthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            user:
              type: object
              properties:
                id: { type: integer }
                email: { type: string }
                firstName: { type: string }
                lastName: { type: string }
                pseudo: { type: string }
            token: { type: string }
            token_type: { type: string, example: Bearer }
            expires_in: { type: integer, description: Durée de vie en secondes }
        message: { type: string }
        code: { type: integer }
    RecipeInput:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        description: { type: string }
        servings: { type: integer }
        is_public: { type: boolean }
        duration: { type: integer }
        time: { type: integer }
        difficulty: { type: string }
        dish_type: { type: string }
        image: { type: string, description: URL http(s) uniquement }
        steps: { type: array, items: { type: string } }
        diet_ids: { type: array, items: { type: integer } }
        ingredients:
          type: array
          items:
            type: object
            properties:
              ingredient_id: { type: integer }
              quantity: { type: number }
              unit_id: { type: integer }
      required: [name, description, servings, is_public]
