<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ymeal API</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui.min.css" />
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui-bundle.min.js"></script>
  <script>
    // Ouvrir ce fichier via un serveur local (ex. : php -S 127.0.0.1:9000 -t docs) pour que openapi.yaml se charge.
    window.ui = SwaggerUIBundle({ url: 'openapi.yaml', dom_id: '#swagger-ui', persistAuthorization: true });
  </script>
</body>
</html>
