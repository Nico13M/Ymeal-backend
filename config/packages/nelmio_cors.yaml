nelmio_cors:
    defaults:
        origin_regex: true
        # Hors dev, seuls le front de production et le front local exact sont autorisés.
        allow_origin:
            - '^https://frontmeal\.osc-fr1\.scalingo\.io$'
            - '^http://localhost:8081$'
        # X-User-Id n'est plus accepté : l'identité vient uniquement du jeton signé (Authorization: Bearer)
        allow_headers: ['Content-Type', 'X-CSRF-TOKEN', 'Authorization']
        allow_methods: ['GET', 'POST', 'PATCH', 'PUT', 'DELETE', 'OPTIONS']
        # Retry-After (réponses 429) doit être exposé pour que le front puisse le lire en CORS
        expose_headers: ['Retry-After']
        allow_credentials: true
        max_age: 3600
    paths:
        '^/': ~

# En développement, localhost et 127.0.0.1 sont autorisés avec un port optionnel
# (l'ancien '^http://localhost.*$' acceptait http://localhost.evil.com).
when@dev:
    nelmio_cors:
        defaults:
            allow_origin:
                - '^https://frontmeal\.osc-fr1\.scalingo\.io$'
                - '^http://(localhost|127\.0\.0\.1)(:[0-9]+)?$'
